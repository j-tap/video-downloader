name: ${APP_NAME:-downloadervr9pro}

services:
  downloadervr9pro:
    # Явное имя образа: без него compose называет образ `<проект>-<сервис>`,
    # и `make up` (docker run $(APP_NAME)) не находит собранный образ.
    image: ${APP_NAME:-downloadervr9pro}:latest
    ports: []
    restart: unless-stopped
    # Настройки едут в контейнер через окружение, а не запечёнными в образ:
    # прокси, лимиты, ALLOWED_HOSTS и пути к cookies меняются без пересборки.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      YT_COOKIES_FILE: ${YT_COOKIES_FILE:-/app/data/cookiesYoutube.txt}
      KINOPUB_COOKIES_FILE: ${KINOPUB_COOKIES_FILE:-/app/data/cookiesKinoPub.txt}
      POT_PROVIDER_BASE_URL: ${POT_PROVIDER_BASE_URL:-http://potprovider:4416}
      # С адреса хостинга YouTube отвечает «Sign in to confirm you're not a bot»
      # на любое видео — пускает только через чужой выход. vpn-proxy — общий VPN
      # сервера в сети vpn-egress (см. README, «Выход для YouTube»). direct
      # в конце — на случай, если VPN на сервере не поднят. Пустое значение
      # в .env (YT_PROXY=) отключает прокси совсем.
      YT_PROXY: ${YT_PROXY-http://vpn-proxy:8888,direct}
      # База задач и файлы API для серверов (/api/v1). Том, а не каталог
      # контейнера: после пересоздания клиент должен получить свою задачу
      # или честный 404, а не ответ сервиса, который всё забыл.
      API_DATA_DIR: ${API_DATA_DIR:-/app/storage/api}
    volumes:
      - ./data:/app/data:ro
      - api-storage:/app/storage
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        MODE: production
        YTDLP_REFRESH: ${YTDLP_REFRESH:-latest}
        YTDLP_CHANNEL: ${YTDLP_CHANNEL:-nightly}
    depends_on:
      - potprovider
    networks:
      - traefik
      - internal
      - vpn-egress

  # Выдаёт PO Token для YouTube. Без токена серверному IP достаётся либо 403,
  # либо единственная дорожка 360p. Наружу не публикуется: только внутренняя
  # сеть, никаких меток traefik.
  potprovider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    # Плагин в основном образе ставится свежим при каждой сборке, а `up -d`
    # без pull держит провайдер той версии, что скачалась впервые. Разные
    # версии плагина и провайдера перестают понимать друг друга.
    pull_policy: always
    restart: unless-stopped
    init: true
    networks:
      - internal

volumes:
  api-storage:

networks:
  traefik:
    external: true
  internal:
    driver: bridge
  # Общая сеть сервера только для выхода через VPN: в ней прокси и те, кто
  # им пользуется, — без соседей VPN-контейнера (браузера, сайтов). Внутренняя,
  # без своего шлюза: интернет у сервиса идёт как прежде, через traefik.
  # Создаётся `make network` и живёт вне проектов, кто бы её ни создал первым.
  vpn-egress:
    external: true
    name: ${VPN_EGRESS_NETWORK:-vpn-egress}
