services:
  downloadervr9pro:
    networks:
      - traefik
      - internal
    labels:
      - "traefik.enable=true"
      # Контейнер подключён к двум сетям (traefik и внутренняя к potprovider).
      # Без явного указания traefik может взять адрес из внутренней сети,
      # до которой сам не достучится, — и сайт отдаст 502.
      - "traefik.docker.network=traefik"

      # HTTPS
      - "traefik.http.routers.downloadervr9pro.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.downloadervr9pro.entrypoints=websecure"
      - "traefik.http.routers.downloadervr9pro.tls.certresolver=myresolver"
      - "traefik.http.services.downloadervr9pro.loadbalancer.server.port=${PORT}"

      # HTTP redirect
      - "traefik.http.routers.downloadervr9pro-http.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.downloadervr9pro-http.entrypoints=web"
      - "traefik.http.routers.downloadervr9pro-http.middlewares=downloader-https-redirect"

      # Middleware definition
      - "traefik.http.middlewares.downloader-https-redirect.redirectscheme.scheme=https"

networks:
  traefik:
    external: true
  internal:
    driver: bridge
